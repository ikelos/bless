name: build

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'
    - name: Install dependencies
      run: >
        sudo apt-get install meson mono-devel
        libnunit-cil-dev nunit-console xsltproc docbook-xsl
    - name: Download gtk-sharp libraries
      run: |
        # Create a minimal project file on the fly
        cat <<EOF > restore.csproj
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>netstandard2.0</TargetFramework>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="GtkSharp" Version="[3.24,4.0)" />
          </ItemGroup>
        </Project>
        EOF

        # Force restore to a local folder
        dotnet restore restore.csproj --packages ./libs/gtksharp

        # Find the exact path for the environment variable
        # NuGet puts things in: ./libs/gtksharp/gtksharp/<version>/lib/netstandard2.0/
        DLL_PATH=$(find ./libs/gtksharp/gtksharp -name "gtk-sharp.dll" | head -n 1 | xargs dirname)
        echo "GTKSHARP_LIB=$DLL_PATH" >> $GITHUB_ENV

        # Clean up the temporary project file
        rm restore.csproj
    - name: Setup
      run: meson setup build
      env:
        CSCFLAGS: "-r:${{ env.GTKSHARP_LIB }}/glib-sharp.dll -r:${{ env.GTKSHARP_LIB }}/gio-sharp.dll -r:${{ env.GTKSHARP_LIB }}/atk-sharp.dll -r:${{ env.GTKSHARP_LIB }}/gdk-sharp.dll -r:${{ env.GTKSHARP_LIB }}/gtk-sharp.dll"
    - name: Build
      run: ninja -C build
    - name: Run tests
      run: meson test -v -C build
      env:
        MONO_PATH: ${{ env.GTKSHARP_LIB }}
    - name: Install
      run: DESTDIR=/tmp/bless-install ninja -C build install
